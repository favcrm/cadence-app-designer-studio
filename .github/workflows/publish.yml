# Publish one Designer Studio release as a verified hosted catalogue listing.
#
# Tag-driven and OIDC-only. agenticos-v2 `REVIEWED_APP_PUBLISHERS` binds this
# repository, this workflow file and `refs/tags/v<version>` to the
# `designer-studio` app id; the catalogue re-verifies the uploaded bytes,
# digest and identity and lists that exact version immediately.
#
# Listing is not installation. A hosted tenant owner installs exactly this
# digest through the consent-aware install/update path. This workflow performs
# no install, capability binding, host rollout or provider/paid action.
#
# A release is a human decision: an operator pushes a plain `vX.Y.Z` tag on a
# reviewed `main` commit. Agents never push the tag. Prerelease tags
# (`v0.1.1-preview.2`) are refused by both this publisher and the catalogue.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      cadence_version:
        description: "Exact Cadence release for the canonical checker (X.Y.Z; no 'latest')"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CADENCE_VERSION: ${{ inputs.cadence_version || vars.CADENCE_TARGET_VERSION || '0.5.1' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a tag on reviewed main
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "publish runs only from a v<X.Y.Z> tag, not $GITHUB_REF" >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "tagged commit $GITHUB_SHA is not on origin/main" >&2; exit 1; }

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.2.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install locked publisher dependencies
        run: pnpm install --frozen-lockfile --dir .github/publisher

      - name: Install the exact pinned Cadence CLI
        run: |
          set -euo pipefail
          bin=$(bash .github/publisher/install-cadence.sh "$CADENCE_VERSION")
          echo "$bin" >> "$GITHUB_PATH"
          echo "Canonical checker: Cadence ${CADENCE_VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the bundle (must pass outright)
        run: |
          set -euo pipefail
          cadence app check package --json > "$RUNNER_TEMP/app-check.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r.get("ok") is True, r.get("refusal"); print(r["name"], r["version"], r["digest"])' "$RUNNER_TEMP/app-check.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release to the catalogue directory
        env:
          APP_CHECK_JSON: ${{ runner.temp }}/app-check.json
          APP_DIR: package
          EXPECTED_REPOSITORY: favcrm/cadence-app-designer-studio
        run: node .github/publisher/publish.mjs
