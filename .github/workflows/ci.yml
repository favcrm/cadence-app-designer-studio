name: app-ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DSN_HOST_SOURCE: ${{ github.workspace }}/.host-contract
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # The Cadence v0.5.1 release commit: keep this pin on the same release as
      # CADENCE_TARGET_VERSION, the publisher's canonical checker (DSN-11).
      - name: Checkout the compatible host contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: favcrm/cadence
          ref: faa98b59c4310e51f60a309d33b3cd0a251c2f17
          path: .host-contract
          persist-credentials: false
      - name: Verify the host contract pin
        run: test "$(git -C .host-contract rev-parse HEAD)" = faa98b59c4310e51f60a309d33b3cd0a251c2f17
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.2.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: node acceptance/image-generation-bridge.mjs
      - run: node acceptance/original-download-bridge.mjs
      - run: node acceptance/drawer-surface-bridge.mjs
      - run: pnpm run build
      - run: node scripts/package-screen.mjs
      - name: Verify committed package bytes and provenance
        run: git diff --exit-code -- package

  # Proves on every change that the release a `v<version>` tag would publish
  # passes the canonical checker and the catalogue publisher's own refusals.
  # DRY_RUN stops before OIDC: nothing is uploaded and no token is requested.
  publish-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CADENCE_VERSION: ${{ vars.CADENCE_TARGET_VERSION || '0.5.1' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.2.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.2"
      - run: pnpm install --frozen-lockfile --dir .github/publisher
      - name: Install the exact pinned Cadence CLI
        run: bash .github/publisher/install-cadence.sh "$CADENCE_VERSION" >> "$GITHUB_PATH"
      - name: Check the bundle (must pass outright)
        run: cadence app check package --json > "$RUNNER_TEMP/app-check.json"
      - name: Dry-run the catalogue publisher for this manifest version
        env:
          APP_CHECK_JSON: ${{ runner.temp }}/app-check.json
          APP_DIR: package
          DRY_RUN: "1"
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$APP_CHECK_JSON")
          GITHUB_REF="refs/tags/v${version}" GITHUB_REPOSITORY=favcrm/cadence-app-designer-studio \
            node .github/publisher/publish.mjs
